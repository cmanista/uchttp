# uchttp HTTPS server sample — Stage 2 (TLS), with WiFi + shell console.
#
# On FRDM-RW612 connect to WiFi from the console, e.g.:
#   uart:~$ wifi connect -s <SSID> -k 1 -p <PASSWORD>
#   uart:~$ net iface                 # shows the DHCP-assigned IPv4
# then from a host on the same network:
#   curl -k https://<device-ip>:8443/api/hello

# C++ (the core engine is C++23).
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# uchttp module + Stage 2 TLS port.
CONFIG_UCHTTP=y
CONFIG_UCHTTP_TLS=y
CONFIG_UCHTTP_MAX_CONNECTIONS=4
CONFIG_UCHTTP_RX_BUFFER_SIZE=1024
CONFIG_UCHTTP_TX_BUFFER_SIZE=1024

# Networking core.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_DHCPV4=y

# Secure sockets (TLS offload at the socket layer) + credential store.
# CONFIG_UCHTTP_TLS already selects these, listed here for clarity.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# Mbed TLS / PSA Crypto backend.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
# Server-side TLS 1.2 with an RSA certificate.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y

# Number of concurrent TLS contexts (must cover the connection pool).
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6

# WiFi + management.
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Console + shell so the user can configure the WiFi connection interactively.
CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# net_mgmt event handling (WiFi scan results can be bursty).
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Buffers / connections.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Stacks — the TLS handshake and Mbed TLS need generous stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=5200

# Logging.
CONFIG_LOG=y
CONFIG_NET_LOG=y
