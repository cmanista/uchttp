# FRDM-RW612 — NXP integrated WiFi (RW610/612). Disables the Ethernet driver
# and enables the on-SoC WiFi so `wifi connect ...` works from the console.
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

# Stacks tuned for the WiFi management + supplicant workload *and* for TLS.
# With Zephyr native secure sockets the TLS record layer (Mbed TLS) runs in the
# network RX/TX work-queue threads — NOT in the application/server thread — so
# an RSA-2048 handshake overflows the default 1500 B rx_q stack. Give the net
# RX/TX threads generous stacks; this is what fixes the "Stack overflow on
# rx_q[0]" fault during the first request.
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096

CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024

# Give Mbed TLS enough heap for an RSA-2048 server handshake on this target.
CONFIG_MBEDTLS_HEAP_SIZE=80000
