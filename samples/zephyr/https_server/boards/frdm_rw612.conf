# FRDM-RW612 — NXP integrated WiFi (RW610/612). Disables the Ethernet driver
# and enables the on-SoC WiFi so `wifi connect ...` works from the console.
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

# Stacks tuned for the WiFi management + supplicant workload plus the TLS
# handshake (Mbed TLS runs in the server thread, but the net/supplicant work
# queues also touch secure sockets).
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024

# Give Mbed TLS enough heap for an RSA-2048 server handshake on this target.
CONFIG_MBEDTLS_HEAP_SIZE=80000
