# native_sim host build — swap the WiFi driver (not available on the host) for
# Zephyr's native TAP Ethernet so the TLS server can be exercised on a PC.
# The WiFi shell/supplicant is a hard dependency only on real radios; on the
# host we bring the interface up over a zeth TAP device instead.
CONFIG_WIFI=n
CONFIG_WIFI_NXP=n
CONFIG_NXP_RW610=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_L2_WIFI_SHELL=n

# Native TAP Ethernet (host networking). Configure your zeth interface per the
# Zephyr "Networking with native_sim" docs to reach the server.
CONFIG_ETH_DRIVER=y
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
