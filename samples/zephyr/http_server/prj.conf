# uchttp HTTP server sample — Stage 1 (HTTP only)

# C++ (the core engine is C++23).
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# uchttp module (pulls in POSIX_API, NETWORKING, NET_TCP, NET_SOCKETS).
CONFIG_UCHTTP=y
CONFIG_UCHTTP_MAX_CONNECTIONS=4
CONFIG_UCHTTP_RX_BUFFER_SIZE=1024
CONFIG_UCHTTP_TX_BUFFER_SIZE=1024

# Networking.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Static IP for quick bring-up (replace with DHCP / WiFi on real hardware).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"

# Buffers / connections.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Main/stack sizing — the server loop runs in main; give it headroom.
CONFIG_MAIN_STACK_SIZE=4096

# Logging.
CONFIG_LOG=y
CONFIG_NET_LOG=y
