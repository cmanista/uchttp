# uchttp WebSocket sample - requirement #8, with WiFi + shell console.
#
# On FRDM-RW612 either set CONFIG_APP_WIFI_SSID / CONFIG_APP_WIFI_PSK (see the
# README: -DEXTRA_CONF_FILE=local.conf) or connect from the console:
#   uart:~$ wifi connect -s <SSID> -k 1 -p <PASSWORD>
# then open http://<device-ip>:8080/ or  wscat -c ws://<device-ip>:8080/ws

# C++ (the core engine is C++23).
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# uchttp module. One connection per server at a time, so a pool of one slot;
# the WebSocket session buffer comes from the slab allocator, not from here.
CONFIG_UCHTTP=y
CONFIG_UCHTTP_MAX_CONNECTIONS=1
CONFIG_UCHTTP_RX_BUFFER_SIZE=1536
CONFIG_UCHTTP_TX_BUFFER_SIZE=1024
CONFIG_UCHTTP_WS_MAX_MESSAGE_SIZE=1024
CONFIG_UCHTTP_WS_IDLE_INTERVAL_MS=1000
CONFIG_UCHTTP_WS_PING_INTERVAL_MS=15000
# Sec-WebSocket-Accept hashed through PSA Crypto (HW where available).
CONFIG_UCHTTP_WS_SHA1_PSA=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# Networking core.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_DHCPV4=y

# WiFi + management.
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Console + shell.
CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# net_mgmt event handling.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Buffers / connections.
CONFIG_NET_MAX_CONN=12
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=5200

# Logging.
CONFIG_LOG=y
CONFIG_NET_LOG=y
