# FRDM-RW612 — NXP integrated WiFi (RW610/612). Disables the Ethernet driver
# and enables the on-SoC WiFi so `wifi connect ...` works from the console.
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

# Stacks tuned for the WiFi management + supplicant workload on this SoC.
#
# CONFIG_UCHTTP_WS_SHA1_PSA enables PSA Crypto, which (via PSA_WANT_ALG_SHA_256)
# turns on CONFIG_NET_TCP_ISN_RFC6528: every incoming SYN is hashed with
# SHA-256 through the ELS/PKC driver *in the network RX thread*. The default
# 1500 B rx_q stack overflows on the first connection, so give the net RX/TX
# threads room.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=3072
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
